text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fade .8s ease-out .2s forwards; }
.track { stroke-dasharray: 546; stroke-dashoffset: 546; animation: draw 2.35s ease-in-out .3s forwards; }
